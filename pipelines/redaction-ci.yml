name: Redaction CI

# This is the main CI/CD pipeline of the the redaction system
parameters:
# User-specified environment to deploy to
- name: env
  default: 'dev'
  values:
  - 'dev'
  - 'test'
  #- 'prod'

# Run when Pull Request raised to the main branch
pr:
  autoCancel: true
  branches:
    include:
      - main

# Run when merged into main
trigger:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0

extends:
  template: stages/wrapper_ci.yml@templates
  parameters:
    validateName: Redaction CI
    globalVariables:
      - template: pipelines/azure-pipelines-variables.yml@self
    validationJobs:
      - name: ValidateCode
        steps:
          - checkout: self
            clean: true

          - script: |
              set -e
              sudo add-apt-repository ppa:deadsnakes/ppa -y
              sudo apt-get update
              sudo apt-get -o DPkg::Lock::Timeout=180 install -y python3.13 python3.13-venv python3.13-dev libffi-dev
              sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.13 1
              python3 -m ensurepip --upgrade
              python3 -m pip install --force-reinstall --no-binary cffi cffi
              python3 --version
            displayName: 'Install Python 3.13'

          - script: |
              set -e
              cd redaction-system
              python3 -m pip install ruff
              export PYTHONPATH=$(pwd)
              python3 -m ruff check
              python3 -m ruff format --check
            displayName: 'Python code style check'

      - name: RunTestsJob
        steps:
          - checkout: self
            clean: true

          - checkout: templates

          - script: |
              set -e
              sudo add-apt-repository ppa:deadsnakes/ppa -y
              sudo apt-get update
              sudo apt-get -o DPkg::Lock::Timeout=180 install -y python3.13 python3.13-venv python3.13-dev libffi-dev
              sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.13 1
              python3 --version
              python3 -m venv $(System.DefaultWorkingDirectory)/.venv
              source $(System.DefaultWorkingDirectory)/.venv/bin/activate
              python3 -m ensurepip --upgrade
              python3 -m pip install --force-reinstall --no-binary cffi cffi
            displayName: 'Install Python 3.13'

          - template: ../steps/azure_auth.yml@templates
            parameters:
              subscriptionId: $(SUBSCRIPTION_ID_${{ upper(parameters.env) }})

          - script: |
              set -e
              source $(System.DefaultWorkingDirectory)/.venv/bin/activate
              cd redaction-system
              python3 -m pip install .[eval]
            displayName: 'Install redactor package'

          - script: |
              set -e
              source $(System.DefaultWorkingDirectory)/.venv/bin/activate
              cd redaction-system/redactor
              export PYTHONPATH=$(pwd)
              python3 -m pytest tests/unit -vv -rP -n 4 --junitxml=junit/unit_test_results.xml --cov="src" --cov-report=xml:unit_test_coverage.xml
              python3 -m coverage report --fail-under=$(unitTestCoverageThreshold) --show-missing
              mv .coverage .coverage.unit
            displayName: 'Run unit tests'

          - task: PublishTestResults@2
            displayName: 'Publish unit test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: '**/unit_test_results.xml'
              testRunTitle: 'Redaction System unit test report - $(Build.BuildId) - $(Build.SourceBranch)'
              mergeTestResults: true

          - script: |
              set -e
              source $(System.DefaultWorkingDirectory)/.venv/bin/activate
              cd redaction-system/redactor
              export PYTHONPATH=$(pwd)
              python3 -m pytest tests/integration -vv -rP -n 4 --junitxml=junit/integration_test_results.xml --cov="src" --cov-report=xml:integration_test_coverage.xml
              python3 -m coverage report --fail-under=$(integrationTestCoverageThreshold) --show-missing
              mv .coverage .coverage.integration
            displayName: 'Run integration tests'

          - task: PublishTestResults@2
            displayName: 'Publish integration test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: '**/integration_test_results.xml'
              testRunTitle: 'Redaction System integration test report - $(Build.BuildId) - $(Build.SourceBranch)'
              mergeTestResults: true

          - template: ../steps/node_script.yml@templates
            parameters:
              displayName: 'Install Azure Functions Core Tools + Azurite'
              nodeVersion: 22
              script: |
                node --version
                npm --version
                npx -p azure-functions-core-tools@4 func --version
                npx -y azurite --version
              workingDirectory: '$(System.DefaultWorkingDirectory)'
              environmentVariables:
                npm_config_cache: $(Pipeline.Workspace)/.npm

          - template: ../steps/node_script.yml@templates
            parameters:
              displayName: 'Start Azurite (background) + wait'
              nodeVersion: 22
              script: |
                set -e
                source $(System.DefaultWorkingDirectory)/.venv/bin/activate

                echo "Starting Azurite..."
                mkdir -p .azurite
                nohup npx -y azurite \
                  --silent \
                  --location .azurite \
                  --debug .azurite/azurite-debug.log \
                  > azurite.log 2>&1 &
                echo $! > azurite.pid

                echo "Waiting for Azurite ports (10000 blob, 10001 queue, 10002 table)..."
                for i in {1..60}; do
                  if (nc -z 127.0.0.1 10000) && (nc -z 127.0.0.1 10001) && (nc -z 127.0.0.1 10002); then
                    echo "Azurite ports are open"
                    exit 0
                  fi
                  sleep 2
                done

                echo "Azurite did not become ready. Last 200 lines:"
                tail -n 200 azurite.log || true
                tail -n 200 .azurite/azurite-debug.log || true
                exit 1
              workingDirectory: '$(System.DefaultWorkingDirectory)/redaction-system'
              environmentVariables:
                npm_config_cache: $(Pipeline.Workspace)/.npm

          - template: ../steps/node_script.yml@templates
            parameters:
              displayName: 'Start local Azure Functions receiver host (background) + wait'
              nodeVersion: 22
              script: |
                set -e
                source $(System.DefaultWorkingDirectory)/.venv/bin/activate

                echo "Creating local.settings.json for Functions host..."

                APPINS="$(APP_INSIGHTS_CONNECTION_STRING)"
                # In PR builds, Azure DevOps may leave this as the literal placeholder.
                if [ -z "${APPINS}" ] || [ "${APPINS}" = "\$(APP_INSIGHTS_CONNECTION_STRING)" ]; then
                  echo "APP_INSIGHTS_CONNECTION_STRING not set (or placeholder). Disabling telemetry for local Functions host."
                  APPINS=""
                  # Disable exporters for this job so the Functions host doesn't crash on invalid AI config.
                  export AZURE_MONITOR_OPENTELEMETRY_ENABLED=false
                  export OTEL_TRACES_EXPORTER=none
                  export OTEL_METRICS_EXPORTER=none
                  export OTEL_LOGS_EXPORTER=none
                fi

                cat > local.settings.json <<JSON
                {
                  "IsEncrypted": false,
                  "Values": {
                    "FUNCTIONS_WORKER_RUNTIME": "python",
                    "AzureWebJobsStorage": "UseDevelopmentStorage=true",
                    "AzureWebJobsSecretStorageType": "files",
                    "AZURE_IDENTITY_DISABLE_MANAGED_IDENTITY": "true",

                    "OPENAI_ENDPOINT": "$(OPENAI_ENDPOINT)",
                    "AZURE_VISION_ENDPOINT": "$(AZURE_VISION_ENDPOINT)",
                    "APP_INSIGHTS_CONNECTION_STRING": "${APPINS}"
                  },
                  "Host": {
                    "LocalHttpPort": 7072,
                    "CORS": "*",
                    "CORSCredentials": false
                  }
                }
                JSON

                echo "Starting Functions host..."
                nohup npx -p azure-functions-core-tools@4 func start --python --port 7072 --verbose > ../func-host-receiver.log 2>&1 &
                echo $! > ../func-host.pid

                echo "Waiting for Functions host (/admin/host/status)..."
                for i in {1..60}; do
                  if curl -sSf http://localhost:7072/admin/host/status >/dev/null 2>&1; then
                    echo "Functions host is up"
                    exit 0
                  fi
                  sleep 2
                done

                echo "Functions host did not become ready. Last 200 lines:"
                tail -n 200 ../func-host-receiver.log || true
                exit 1
              workingDirectory: '$(System.DefaultWorkingDirectory)/redaction-system/receiver'
              environmentVariables:
                npm_config_cache: $(Pipeline.Workspace)/.npm

          - template: ../steps/node_script.yml@templates
            parameters:
              displayName: 'Start local Azure Functions processor host (background) + wait'
              nodeVersion: 22
              script: |
                set -e
                source $(System.DefaultWorkingDirectory)/.venv/bin/activate

                echo "Creating local.settings.json for Functions host..."

                APPINS="$(APP_INSIGHTS_CONNECTION_STRING)"
                # In PR builds, Azure DevOps may leave this as the literal placeholder.
                if [ -z "${APPINS}" ] || [ "${APPINS}" = "\$(APP_INSIGHTS_CONNECTION_STRING)" ]; then
                  echo "APP_INSIGHTS_CONNECTION_STRING not set (or placeholder). Disabling telemetry for local Functions host."
                  APPINS=""
                  # Disable exporters for this job so the Functions host doesn't crash on invalid AI config.
                  export AZURE_MONITOR_OPENTELEMETRY_ENABLED=false
                  export OTEL_TRACES_EXPORTER=none
                  export OTEL_METRICS_EXPORTER=none
                  export OTEL_LOGS_EXPORTER=none
                fi

                cat > local.settings.json <<JSON
                {
                  "IsEncrypted": false,
                  "Values": {
                    "FUNCTIONS_WORKER_RUNTIME": "python",
                    "AzureWebJobsStorage": "UseDevelopmentStorage=true",
                    "AzureWebJobsSecretStorageType": "files",
                    "AZURE_IDENTITY_DISABLE_MANAGED_IDENTITY": "true",

                    "OPENAI_ENDPOINT": "$(OPENAI_ENDPOINT)",
                    "AZURE_VISION_ENDPOINT": "$(AZURE_VISION_ENDPOINT)",
                    "APP_INSIGHTS_CONNECTION_STRING": "${APPINS}"
                  },
                  "Host": {
                    "LocalHttpPort": 7071,
                    "CORS": "*",
                    "CORSCredentials": false
                  }
                }
                JSON

                echo "Starting Functions host (orchestrator + activity only, no Service Bus trigger)..."
                nohup npx -p azure-functions-core-tools@4 func start --python --port 7071 --functions trigger_orchestrator trigger_task send_failure_notification --verbose > ../func-host-processor.log 2>&1 &
                echo $! > ../func-host.pid

                echo "Waiting for Functions host (/admin/host/status)..."
                for i in {1..60}; do
                  if curl -sSf http://localhost:7071/admin/host/status >/dev/null 2>&1; then
                    echo "Functions host is up"
                    exit 0
                  fi
                  sleep 2
                done

                echo "Functions host did not become ready. Last 200 lines:" 
                tail -n 200 ../func-host-processor.log || true
                exit 1
              workingDirectory: '$(System.DefaultWorkingDirectory)/redaction-system/redactor'
              environmentVariables:
                npm_config_cache: $(Pipeline.Workspace)/.npm

          - script: |
              set -e
              source $(System.DefaultWorkingDirectory)/.venv/bin/activate

              echo "Warming up Durable Functions orchestrator..."
              ORCH_URL="http://localhost:7071/runtime/webhooks/durabletask/orchestrators/trigger_orchestrator"

              # Wait for the orchestrator endpoint to accept requests
              for i in {1..30}; do
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$ORCH_URL" \
                  -H "Content-Type: application/json" \
                  -d '{"warmup": true}' 2>/dev/null || echo "000")
                if [ "$STATUS" = "202" ] || [ "$STATUS" = "409" ]; then
                  echo "Orchestrator endpoint is accepting requests (HTTP $STATUS)"
                  break
                fi
                echo "Orchestrator not ready yet (HTTP $STATUS), retrying in 3s..."
                sleep 5
              done

              if [ "$STATUS" != "202" ] && [ "$STATUS" != "409" ]; then
                echo "Orchestrator did not become ready. Last 100 lines of processor log:"
                tail -n 100 func-host-processor.log || true
                exit 1
              fi

              # Wait for warm-up orchestration to complete
              sleep 5
              echo "Warm-up complete"
            displayName: 'Warm up Durable Functions orchestrator'

          - script: |
              set -e
              source $(System.DefaultWorkingDirectory)/.venv/bin/activate
              cd redaction-system/redactor
              export PYTHONPATH=$(pwd)

              export E2E_FUNCTION_RECEIVER_BASE_URL="http://localhost:7072"
              export E2E_FUNCTION_PROCESSOR_BASE_URL="http://localhost:7071"
              export E2E_STORAGE_ACCOUNT="pinsstredaction${{ parameters.env }}uks"
              export E2E_CONTAINER_NAME="test"
              export E2E_RUN_ID="ado-$(Build.BuildId)"
              export E2E_SKIP_REDACTION="false"
              export AZURE_IDENTITY_DISABLE_MANAGED_IDENTITY=true

              python3 -m pytest -m e2e -vv -rP --junitxml=junit/e2e_test_results.xml
            displayName: 'Run e2e tests'

          - script: |
              set +e
              echo "Stopping Functions host..."
              if [ -f redaction-system/func-host.pid ]; then
                kill "$(cat redaction-system/func-host.pid)" || true
              fi
              pkill -f "func start" || true
              pkill -f "azure-functions-core-tools" || true
              pkill -f "workers/python" || true

              echo "Stopping Azurite..."
              if [ -f redaction-system/azurite.pid ]; then
                kill "$(cat redaction-system/azurite.pid)" || true
              fi
              pkill -f "azurite" || true

              echo "Done"
            displayName: 'Stop local Functions host + Azurite'
            condition: succeededOrFailed()

          - task: PublishBuildArtifacts@1
            displayName: 'Publish e2e receiver log'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/redaction-system/func-host-receiver.log'
              ArtifactName: 'e2e-local-receiver-logs'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish e2e processor log'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/redaction-system/func-host-processor.log'
              ArtifactName: 'e2e-local-processor-logs'


          - script: |
              set -e
              source $(System.DefaultWorkingDirectory)/.venv/bin/activate
              cd redaction-system/redactor
              python3 -m coverage combine
              python3 -m coverage report
              python3 -m coverage xml -o coverage.xml
            displayName: 'Combine coverage reports'

          - task: UseDotNet@2
            displayName: 'Install latest .net'
            inputs:
              packageType: 'sdk'
              version: '8.x'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish coverage reports'
            inputs:
              summaryFileLocation: '$(Build.SourcesDirectory)/redaction-system/redactor/coverage.xml'

          - script: |
              set -e
              source $(System.DefaultWorkingDirectory)/.venv/bin/activate
              cd redaction-system/redactor
              python3 -m coverage report --fail-under=$(totalTestCoverageThreshold) --show-missing
            displayName: 'Fail if test coverage is below the threshold'
