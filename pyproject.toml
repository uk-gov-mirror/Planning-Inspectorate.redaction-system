[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "redactor"
version = "0.0.1"
description = "Redaction System"
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-vision-imageanalysis>=1.0.0",
    "azure-functions>=2.2.0",
    "azure-identity>=1.25.3",
    "azure-monitor-opentelemetry>=1.8.9",
    "azure-storage-blob>=12.30.0",
    "click>=8.1.0",
    "langdetect>=1.0.9",
    "langchain>=1.3.14",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.50.0",
    "pydantic>=2.12.5",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "tiktoken>=0.13.0",
    "pytest>=9.1.1",
    "azure-functions-durable>=1.4.0",
    "azure-servicebus>=7.14.3",
    "coverage>=7.15.2",
    "filelock>=3.32.2",
    "pre-commit>=4.5.1",
    "python-dotenv>=1.2.2",
    "pymupdf>=1.28.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.1.0",
    "pytest-rerunfailures>=16.4",
    "ruff>=0.16.0",
    "unidecode>=1.4.0",
    "strenum>=0.4.15",
    "numpy>=2.5.1",
    "matplotlib>=3.10.0",
]
classifiers = [
    "Programming Language :: Python :: 3.13",
]
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = [
    "coverage",
    "mock",
    "myst-parser",
    "pre-commit",
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "ruff",
    "toml",
]
eval = [
    "gepa>=0.1.4",
    "litellm>=1.106.2",
    "mlflow>=3.5",
]

[tool.setuptools.packages.find]
where = ["redactor"]

[tool.setuptools.package-data]
"src.config" = ["*.yaml"]

# `coverage` configurations
[tool.coverage.run]
source = [
    "./redactor/"
]
omit = [
    "tests/*",
    "function_app.py",
]
concurrency = "multiprocessing"

[tool.coverage.report]
exclude_also = [
    "@abstractmethod",
    "if __name__ == .__main__.:,"
]
show_missing = "true"

[dependency-groups]
dev = [
    "azure-ai-agents>=1.1.0",
    "azure-ai-inference>=1.0.0b9",
    "azure-ai-ml>=1.34.1",
    "azure-ai-projects>=2.4.0",
    "docker>=7.2.0",
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "huggingface-hub>=1.26.1",
    "ipykernel>=7.2.0",
    "pip>=26.2.1",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
]
    
[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

# `bandit' configurations
[tool.bandit]
exclude_dirs = ["redactor/tests"]
skips = []
