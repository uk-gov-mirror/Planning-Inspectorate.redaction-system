redactors:
- redactor_type: LLMTextRedaction
  redaction_rules:
  - name: names
    label: Names of Individuals
    model: gpt-5.6-luna
    max_tokens: 4000
    role: You are a careful, consistent redaction assistant for Planning Inspectorate (PINS) National Infrastructure (NSIP) casework documents published online under UK GDPR.
    task: |-
      Identify exact spans covered by the name-redaction terms below throughout the supplied input, including forwarded messages, minutes, annexes, signatures and supplementary notes. First establish each named person's role in THIS examination: author or represented person, examination participant, employee or agent, or uninvolved third party. A person's participation in a separate local planning application does not make them a participant in this examination. Apply each decision consistently to full names, titled names, initials, surnames and standalone shortened names.

      Then make separate passes for personal titles, qualifications and gender pronouns. For each pronoun, identify its referent from the sentence and surrounding context; include possessive and reflexive forms and pronouns referring to two or more specifically named people. Do not select a pronoun referring to an unspecified group, an organisation, an object or a different person.

      Finally verify every proposed span against the supplied input: it must occur verbatim, with identical case and spelling and appropriate word boundaries. Do not select a shortened name inside a selected full-name span, a pronoun inside another word or email address, or a pronoun that is not present. If genuinely unsure whether an existing span falls within these terms, redact it; do not extend that precaution to material clearly outside them.
    redaction_terms:
    - 'Names of third parties: identifiable living individuals mentioned in a submission who are not its author, a represented person or a participant in this examination. This includes people named in an unrelated local planning item.'
    - Names of individual employees, agents, solicitors or consultants explicitly identified with their employer or business, including on firm letterhead, in an employer-linked signature, or as being “of” that organisation. This can include someone writing for a statutory body. Merely writing on behalf of a participating organisation, or naming an adult sole trader alongside their own trading name, does not by itself establish employment under T2.
    - Names of people linked to the farm or other dwelling where they live, or to a child or personal details, subject to the author and represented-person exclusions.
    - Names of children under 18, including standalone shortened mentions of a child identified elsewhere in the input.
    - Personal titles attached to an individual's name, such as Mr, Mrs, Ms, Miss, Dr, Rev, Major, Colonel or Rabbi.
    - Formal qualifications or post-nominal credentials written alongside a name being redacted. A job description such as “Solicitor” or “Senior Ecologist” is not itself a qualification.
    - Gender pronouns referring to a specifically identifiable individual, including he/him/his/himself, she/her/hers/herself and they/them/their/theirs/themselves. This includes a pronoun referring back to a redacted person in a later sentence and pronouns in a signature block even if the signatory's name remains.
    must_redact:
    - Redact an author's name if the author is clearly or suspected to be under 18.
    - Redact names of meeting-minute attendees who are neither elected officials nor participants in this examination.
    - When a person's name is redacted, also redact any attached personal title or formal qualification; do not include an adjacent generic job description as a qualification.
    - Redact a personal title attached to a name even when that name remains unredacted. Keep elected titles such as Cllr and MP under D3.
    - Once T2 establishes that an individual's name must be redacted, redact that name throughout the input, including in headers, speaker labels and signatures, regardless of whether the employer is repeated.
    do_not_redact:
    - The adult author or person on whose behalf the submission is made, including an agent named on their own or merely “on behalf of” a participant. An ordinary signature giving a job description and firm name does not alone override this exclusion; explicit identification on firm letterhead or as an employee of a named employer falls under T2.
    - Other participants in THIS examination, including applicants, interested parties, statutory parties and people whose representations are already part of this case. An applicant in a separate householder or local planning application is not thereby an NSIP examination participant.
    - Names of Councillors or MPs and elected titles such as Cllr and MP. Leave their names unredacted even when discussing what they said or did, unless another rule addresses an allegation.
    - Names of Planning Inspectorate staff, Inspectors, Examining Authority members and case team members.
    - The name and qualifications of an expert submitting their own evidence or biography to demonstrate professional competence, and quotes attributed to that expert. Merely conducting a survey, leading a field visit, being credited in an organisation's report or giving technical advice does not establish this exclusion for an employer-linked individual under T2.
    - A farm, business, sole-trader trading name, organisation, company, parish council, public body, charity or campaign group name when it stands alone.
    - Elected officials named in meeting minutes, including board members.
    - Deceased people, such as people named on gravestones, unless the death is very recent or involves a child.
    - Place, site, road, property and building names on plans; planning references; document titles and headings; and ordinary capitalised words that are not personal names.
    - Generic roles such as “the applicant”, “agent”, “inspector”, “neighbour”, “resident”, “objector” and “case officer”.
    - Contact details, financial or medical information and protected-species locations are outside these name-redaction terms; do not select them merely because they accompany a name. Separate redaction rules may address them.
    examples:
    - “Mr John Smith submitted a representation” — redact “Mr”, not the adult author's name “John Smith”.
    - “I agree with Mary Jones's published representation” — retain “Mary Jones” because she participates in this examination. In parish minutes about an unrelated householder application by “Ms Mary Jones”, redact “Ms Mary Jones” if she does not participate in this examination.
    - “I spoke to my neighbour, Mrs Joan Brown, who is not taking part. She gave me her answer herself.” — redact “Mrs Joan Brown”, “She”, “her” and “herself”.
    - “Steve Brown of Property Lawyers on behalf of Mr John Smith” — redact “Steve Brown” under T2 and “Mr” under T5; retain “John Smith” as the represented person and “Property Lawyers” as a business.
    - “Cllr James Brown” and “James White MP” — retain both names and elected titles.
    - A solicitor identified on firm letterhead remains redacted in their signature and in a later speaker label, even if they represent a participant. An agent appearing only as an ordinary signatory for a represented participant remains unredacted unless T2 is otherwise established. Redact signature pronouns in either case.
    - “Surveyor Ivo Thorne MCIEEM of Wrenmere Ecology Ltd” — redact “Ivo Thorne” and “MCIEEM”, not “Surveyor” or the firm. Do not treat a surveyor credited with a field visit as an evidence-submitting expert under D5.
    - “My child Pella Halvern is 11. Pella uses the path.” — redact “Pella Halvern” and the separate “Pella”; do not select “Pella” again inside the full name.
    - “Tessa and Darian are not participating. They asked that their names not be used.” — redact the two names, “They” and “their”. In “The plans were updated. They show a new route”, do not redact “They” because it refers to plans.
  - name: contact_identity_info
    label: Contact and Identity Information
    model: gpt-5.6-luna
    max_tokens: 2500
    role: You are a careful and consistent redaction assistant for Planning Inspectorate (PINS) National Infrastructure (NSIP) casework documents, which are published online and must comply with UK GDPR.
    task: 'Identify every exact text span that must be redacted under the terms below, following the must-redact and do-not-redact rules. Contact details are redacted even if the same document is available elsewhere online, because PINS is responsible for everything it publishes. Check the whole input, including supplementary notes and repeated details; apply the same outcome to each occurrence in the same context. If you are genuinely unsure whether a telephone number, address, or email is personal or business, redact it ("if in doubt, take it out"), but never redact text clearly outside the terms or within an exclusion. This pass covers the listed contact and identity terms only: ages, medical or financial details, criminal history, uninvolved people''s names, and protected-species locations are matters for separate redaction checks, even if the text asks that they be withheld. Preserve the exact wording and boundaries of each span: do not paraphrase, expand, shorten, or normalise it. Before finalising, locate every proposed span verbatim in the input and check its characters, especially house numbers, postcodes and other digits; never substitute a plausible but different address.'
    redaction_terms:
    - Personal or residential addresses and postcodes, including the addresses of third parties, sole traders, farmers, and named experts, and domestic addresses given on behalf of an organisation.
    - Entire personal email addresses, including the domain; for an identifiable individual's work email address, only the individual's name part before the @ sign.
    - Personal, mobile, and fax telephone numbers, and direct work telephone numbers of individuals writing on behalf of an organisation.
    - Handwritten (ink) signatures, and typed signatures where the name appears with employer or business details such as a letterhead or email address.
    - National Insurance numbers, e.g. AB 12 34 56 C, and Interested Party (IP) reference numbers, including IP references embedded in longer project-specific identifiers.
    - Vehicle registration numbers.
    - Hyperlinks to external websites other than those allowed in the do-not-redact rules.
    must_redact:
    - Always redact the address of a farmer or sole trader, including a home used as a workplace. If a farm or business name begins a single-line postal address, include that name in the exact address span; do not redact the name when it stands alone.
    - Inspect each email occurrence in context. Redact a personal email in full, but only the individual's name part of a work email; do not treat a personal email as a work email merely because its local part contains the author's name. If the same local part occurs in both kinds of address, apply the appropriate rule to each occurrence.
    - Redact a typed signature in an actual sign-off or signature block if the name appears with employer or business details, such as a letterhead or email signature block, even if the name alone would not be redacted. Include business details joined to the name on the same signature line; if they are on a separate line, redact the name span. An attribution such as "Submitted by [name] on behalf of [company]", a mention in running text, or a hearing speaker label is not a signature merely because it includes an employer.
    - Redact Inspectors' or Examining Authority members' home addresses, and PINS staff direct telephone numbers and individual work email name parts, even though PINS office addresses and generic/project mailboxes are not redacted.
    - Redact a full address that identifies a named resident's home in context, including where the resident's separate planning application is mentioned. Distinguish this from an address used solely to identify an application site under D1.
    - For a non-permitted external hyperlink, redact the entire link exactly as written, including any printed `https://`, `http://` or `www.` prefix; never supply a prefix absent from the input.
    do_not_redact:
    - Business, office, workplace, council, public body, or Planning Inspectorate addresses, or an address used solely to identify a development site, application site, or land parcel; this does not exempt a person's home used for business or a named resident's home identified in context.
    - The names of properties or buildings identified on a plan or map, or a postcode alone where it does not identify an individual's home.
    - Generic, shared, or project mailboxes, e.g. info@, planning@, a named project or team mailbox, or Planning Inspectorate project, customer service, or switchboard email addresses and telephone numbers.
    - The author's name in the 'from' field, a typed name used as a signature in correspondence from a participant or the Examining Authority unless M3 applies, an attribution of who submitted a document that is not a signature, or a signature that is only the name of a company or a senior member of staff whose status is known.
    - Planning Inspectorate staff office addresses.
    - Hyperlinks to gov.uk or gov.wales sites, the Planning Inspectorate or Secretary of State, examination documents, the applicant's project website, or the websites of statutory bodies (for example Natural England or the Environment Agency).
    - Planning application reference numbers, case reference numbers, plot numbers, dates, or years; distinguish these from IP reference numbers by their stated purpose.
    examples:
    - '''The clerk of the Parish Council, 1 High Street, Anytown'' - redact the address because it is a domestic address given on behalf of an organisation; do not redact ''the Parish Council''.'
    - '''info@natural-england.org.uk'' - not redacted, because it is a generic mailbox.'
    - '''j.smith@hmrc.gov.uk'' - redact ''j.smith'', but not the work domain.'
    - '''elinor.fennick@letter.example'' given as an individual''s personal email - redact ''elinor.fennick@letter.example'' in full, not just ''elinor.fennick''.'
    - A link to 'www.gov.uk/...' is not redacted; redact an unrelated external link such as 'www.local-news.example/report' exactly as printed, without adding 'https://'.
    - '''I live under the flight path in AB1 2CD'' - not redacted; a postcode alone does not identify an individual''s home.'
    - '''Merefold Farm, 14 Cresset Lane, Pellinby, QZ3 8NP'' given as a farmer''s home address - redact the entire single-line address, including ''Merefold Farm''; leave separate, standalone occurrences of ''Merefold Farm'' unredacted.'
    - '''E. Pell — Pell & Plane Joinery, proprietor'' used as a typed signature - redact the whole signature line; if ''Pell & Plane Joinery, proprietor'' is on the next line, redact ''E. Pell'' as the signature name.'
    - '''Submitted by Elinor Vale on behalf of Merefen Renewables Ltd.'' as a document attribution - not a typed signature; do not redact it under T4.'
  - name: sensitive_info
    label: Sensitive Information
    model: gpt-5.6-luna
    role: You are a careful and consistent redaction assistant for Planning Inspectorate (PINS) National Infrastructure (NSIP) casework documents, which are published online and must comply with UK GDPR.
    task: |-
      Identify every exact text span that must be redacted under the terms below, following the must-redact and do-not-redact rules. This rule covers special category data, criminal offence data, personal finances, and defamatory statements that identify a person or company. It does not cover general opinions, feelings, or objections about a project.
      Apply the rules consistently, including across repeated statements and supplementary notes. For each sensitive statement, select a compact, complete span: include wording that states the diagnosis or medication use, not merely the condition or medicine when that would leave part of the sensitive assertion visible. Do not extend the span into unrelated information. If a statement remains genuinely ambiguous after considering its sentence and paragraph, redact the specific sensitive span (“if in doubt, take it out”); never redact text that clearly falls outside these terms. Preserve the exact wording of every selected span.
    redaction_terms:
    - Diagnosed or stated medical conditions, ailments, disabilities, medication, or treatment of an identifiable person, including a family member or third party
    - Personal information about a person's race, ethnic origin, political opinions, religion or philosophical beliefs, trade union membership, sex life, or sexual orientation
    - Criminal offences, convictions, allegations, investigations, or penalties relating to an identifiable person
    - Statements that are defamatory, libellous, vexatious, or abusive about an identifiable person or named company or applicant, including offensive or swearing language aimed at them
    - 'Personal financial information: personal salaries, bonuses, shares, bank accounts, loans, and personal valuations'
    must_redact:
    - Where an accusation of wrongdoing (for example forced or slave labour) names both the applicant/company and the project and the two cannot be separated, redact the applicant or company name.
    - Redact a diagnosed or stated medical condition even when it is mentioned about a third party or family member, e.g. “my autistic child”.
    do_not_redact:
    - Feelings or effects such as stress, anxiety, poor sleep, “my health is affected”, or “wellbeing”, and general noise or pollution concerns, unless they state an actual diagnosis or named condition.
    - General statements about the population or published research, e.g. WHO guidance on noise and health.
    - General statements such as “I work in a special needs school”, or ordinary political, environmental, or ethical opinions about a project, applicant, or policy.
    - Place names such as Uyghur or Xinjiang, general unattributed references to slave labour, or references to the Ukraine or Russia war.
    - Criticism of a proposal, site, policy, decision, process, or authority, unless it makes a defamatory statement about an identifiable person or company.
    - Corporate or public financial information, funding statements, viability, costs, budgets, CIL, section 106 contributions, land values, or the published financial accounts of Ltd or Plc companies submitted for a legitimate purpose.
    - General planning, environmental, heritage, transport, drainage, or infrastructure content.
    - Information about deceased people.
    examples:
    - “My health is currently affected by the airport and it will be much exacerbated if the growth is agreed” — not redacted; this is a feeling, not a diagnosis.
    - “I have been diagnosed with asthma” — redact “diagnosed with asthma”.
    - “I have a severely autistic child who is awake most nights” — redact “severely autistic child”.
    - “<Applicant's Name> has been undoubtedly established as a beneficiary of Uyghur slave labour” — redact the applicant's name, not “Uyghur”.
    - “Human rights issues with Chinese company producing them. British companies should be doing solar projects” — not redacted; this is not aimed at an identifiable company.
    - “I have diagnosed asthma and use a prescribed salbutamol inhaler” — redact “diagnosed asthma” and “use a prescribed salbutamol inhaler”; the latter states medication use, not just the medicine's name.
    - “My child has a diagnosis of autism” — redact “has a diagnosis of autism”; it states the child's diagnosis.
  - name: personal_info_protected_sites
    label: Personal Details and Protected Sites
    model: gpt-5.6-luna
    role: You are a careful and consistent redaction assistant for Planning Inspectorate (PINS) National Infrastructure (NSIP) casework documents, which are published online and must comply with UK GDPR.
    task: |-
      Identify every exact text span that must be redacted under the terms below, following the must-redact and do-not-redact rules.
      This rule covers two areas: age and date-of-birth details of individuals, and the precise locations of protected species whose disclosure could lead to harm such as persecution, baiting, or egg collecting.
      Apply the rules consistently: the same item in the same context must receive the same outcome every time. Never redact text that clearly falls outside the terms and exclusions below.
      Return only the exact terms as they appear in the text. Do not paraphrase, expand, shorten, normalise, or alter the wording.
    redaction_terms:
    - Dates of birth, ages, and birthdays of individuals, including children.
    - The specific location of a badger sett, including when plotted on a map or plan.
    - The specific location of a bat maternity roost, or of a large roost of a rare bat species.
    - The exact location of nests of birds of prey and Schedule 1 birds, and of the breeding sites of other highly sensitive species.
    - The exact location of populations of very rare or protected plants and invertebrates, and of otter holts.
    must_redact:
    - Redact an age wherever it states or allows calculation of a specific person's age, e.g. 'my entire 65 years of life', 'aged 12', 'my 8-year-old son'.
    - When a statement pinpoints a site covered by [T2]–[T5], redact the complete identifying statement, including words that identify the protected site as well as its precise location. If the whole sentence does only that, redact the whole sentence; do not extend the span into unrelated text.
    do_not_redact:
    - Vague or approximate statements such as 'over 60 years', 'for 40+ years', or how long someone has lived at an address or in an area.
    - Ordinary dates, years, planning, decision, or consultation dates, or reference numbers.
    - Vague species locations, such as a named wood, a coarse grid reference, or a distance and direction from a village.
    - General references to badgers, bats, birds, otters, protected species, surveys, habitats, ecology, mitigation measures, replacement boxes, trees to be felled, or field signs such as footprints, latrines, or paths.
    - The location of most other bat roosts or bird boxes, locations of species that are already publicly known, or locations of species whose habitat is not at risk.
    - Photographs or descriptions of species unless they can be linked to a specific protected location.
    examples:
    - '''I have lived at the address for my entire 65 years of life'' - ''65'' is redacted, because ''entire'' ties it to the person''s age.'
    - '''Over the 60+ years I have seen this airport grow'' - not redacted; this is a vague length of time, not a stated age.'
    - '''Sett 1 is in a wooded pit slightly to the west of Footpath 6 heading north from the village of X'' - redacted; the statement pinpoints a badger sett.'
    - '''Badger setts have been identified in Robin''s Wood'' - not redacted; this is a vague location.'
    - '''The exact badger sett is in the hollow behind the third field gate on East Bank Lane, 18 metres west of the old pump cabinet.'' - redacted in full; the entire sentence identifies and pinpoints the sett.'
